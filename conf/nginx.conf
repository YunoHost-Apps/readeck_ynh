#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  proxy_pass http://127.0.0.1:__PORT__;

  include proxy_params_no_auth;
  proxy_redirect off;
  proxy_buffering off;
  client_max_body_size 50M;

  # Temporary headers to improve security waiting for a fix in the core, cf. https://github.com/YunoHost-Apps/readeck_ynh/issues/81
  more_set_headers "Content-Security-Policy: upgrade-insecure-requests; base-uri 'none'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; media-src 'self' data:; object-src 'none';";
  more_set_headers "X-Frame-Options: DENY always";
}
