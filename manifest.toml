#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "readeck"
name = "Readeck"
description.en = "Bookmark manager and a read later tool"
description.fr = "Gestionnaire de favoris et outil de lecture ultérieure"

version = "0.23.6~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "AGPL-3.0"
website = "https://readeck.org/"
admindoc = "https://readeck.org/en/docs/"
code = "https://codeberg.org/readeck/readeck"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    i386.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.6/readeck-0.23.6-linux-386"
    i386.sha256 = "a4fcf2a6a5c3ebfe6961e943013eba1a00350ef56224a0d796aebe060b269aee"
    amd64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.6/readeck-0.23.6-linux-amd64"
    amd64.sha256 = "247d8f8c8423c7103df3838660ca2e2405f9ed961391c5318286b25935cca038"
    arm64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.6/readeck-0.23.6-linux-arm64"
    arm64.sha256 = "4d90dd74a77fd1586a223efed609b1e13e1197c8e588a9e4b4189a715849e15a"
    armhf.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.6/readeck-0.23.6-linux-arm-5"
    armhf.sha256 = "1947e9b15b965cd81c6a038111fb0f36b626fc438a4f4da4cc931f5380eda5b3"
    rename = "readeck"

    autoupdate.strategy = "latest_forgejo_release"
    autoupdate.asset.i386 = "^readeck-.*-linux-386$"
    autoupdate.asset.amd64 = "^readeck-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^readeck-.*-linux-arm64$"
    autoupdate.asset.armhf = "^readeck-.*-linux-arm-5$"
    
    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.auth_header = false

    opds.url = "/opds"
    opds.allowed = "visitors"
    opds.show_tile = false
    opds.auth_header = false

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
