#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "readeck"
name = "Readeck"
description.en = "Bookmark manager and a read later tool"
description.fr = "Gestionnaire de favoris et outil de lecture ultérieure"

version = "0.22.3~ynh3"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "AGPL-3.0"
website = "https://readeck.org/"
admindoc = "https://readeck.org/en/docs/"
code = "https://codeberg.org/readeck/readeck"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    i386.url = "https://codeberg.org/readeck/readeck/releases/download/0.22.3/readeck-0.22.3-linux-386"
    i386.sha256 = "b92778284f9538d4a2c3a02b5f6fcaf8ab2fa1e5f0ac7cb21367447d8a6b03a5"
    amd64.url = "https://codeberg.org/readeck/readeck/releases/download/0.22.3/readeck-0.22.3-linux-amd64"
    amd64.sha256 = "e24df8cf73e835caaae11aa36bfcbc907719da2c93c62034ab006ac7033d34fe"
    arm64.url = "https://codeberg.org/readeck/readeck/releases/download/0.22.3/readeck-0.22.3-linux-arm64"
    arm64.sha256 = "3b2fe7f4d3c1e2a3d0272b8529f4e9f1e5796f9799a7e7d309de2e7b98341ce4"
    armhf.url = "https://codeberg.org/readeck/readeck/releases/download/0.22.3/readeck-0.22.3-linux-arm-5"
    armhf.sha256 = "861013bfaff2652feff8adcc9813c40e3b17815cade3dd6e7abaefffeb154e68"
    rename = "readeck"

    autoupdate.strategy = "latest_forgejo_release"
    autoupdate.asset.i386 = "^readeck-.*-linux-386$"
    autoupdate.asset.amd64 = "^readeck-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^readeck-.*-linux-arm64$"
    autoupdate.asset.armhf = "^readeck-.*-linux-arm-5$"
    
    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.auth_header = false

    opds.url = "/opds"
    opds.allowed = "visitors"
    opds.show_tile = false
    opds.auth_header = false

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
