#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "readeck"
name = "Readeck"
description.en = "Bookmark manager and a read later tool"
description.fr = "Gestionnaire de favoris et outil de lecture ultérieure"

version = "0.23.5~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "AGPL-3.0"
website = "https://readeck.org/"
admindoc = "https://readeck.org/en/docs/"
code = "https://codeberg.org/readeck/readeck"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    i386.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.5/readeck-0.23.5-linux-386"
    i386.sha256 = "d654b4f58d6c7482fc1ede8cfdf74e6df8b94829bec1ffedf7138b76121ee554"
    amd64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.5/readeck-0.23.5-linux-amd64"
    amd64.sha256 = "77d1783e71d423d479189a8c7631bde53bb87b8e95b3029a244312c7310c4c5e"
    arm64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.5/readeck-0.23.5-linux-arm64"
    arm64.sha256 = "b44f208d4a0c424a2e2f122df7796f2099dcab49479a71ccc1348783a5af334a"
    armhf.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.5/readeck-0.23.5-linux-arm-5"
    armhf.sha256 = "b88c378df08f33b649336ff4649cf444e0df8af104a00d605532eec0b2c65702"
    rename = "readeck"

    autoupdate.strategy = "latest_forgejo_release"
    autoupdate.asset.i386 = "^readeck-.*-linux-386$"
    autoupdate.asset.amd64 = "^readeck-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^readeck-.*-linux-arm64$"
    autoupdate.asset.armhf = "^readeck-.*-linux-arm-5$"
    
    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.auth_header = false

    opds.url = "/opds"
    opds.allowed = "visitors"
    opds.show_tile = false
    opds.auth_header = false

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
