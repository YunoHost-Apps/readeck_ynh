#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "readeck"
name = "Readeck"
description.en = "Bookmark manager and a read later tool"
description.fr = "Gestionnaire de favoris et outil de lecture ultérieure"

version = "0.23.4~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "AGPL-3.0"
website = "https://readeck.org/"
admindoc = "https://readeck.org/en/docs/"
code = "https://codeberg.org/readeck/readeck"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    i386.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.4/readeck-0.23.4-linux-386"
    i386.sha256 = "d4d203fd99de2ef77518a00c607f4d8eca3a7078e4557843784005096144392c"
    amd64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.4/readeck-0.23.4-linux-amd64"
    amd64.sha256 = "18652e49cced19b893f26d6150859c394ba503d6b5e4d9fbdff6cc035a2bada4"
    arm64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.4/readeck-0.23.4-linux-arm64"
    arm64.sha256 = "472826467f11a325acc268a4dd4ad8abe46fc58b5602a6bc30937c4c34acf0c3"
    armhf.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.4/readeck-0.23.4-linux-arm-5"
    armhf.sha256 = "c767ea0c851c43cab710c8817c70b04e661a9297e1f060ac40c9c1bf65917971"
    rename = "readeck"

    autoupdate.strategy = "latest_forgejo_release"
    autoupdate.asset.i386 = "^readeck-.*-linux-386$"
    autoupdate.asset.amd64 = "^readeck-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^readeck-.*-linux-arm64$"
    autoupdate.asset.armhf = "^readeck-.*-linux-arm-5$"
    
    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.auth_header = false

    opds.url = "/opds"
    opds.allowed = "visitors"
    opds.show_tile = false
    opds.auth_header = false

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
