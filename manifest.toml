#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "readeck"
name = "Readeck"
description.en = "Bookmark manager and a read later tool"
description.fr = "Gestionnaire de favoris et outil de lecture ultérieure"

version = "0.23.2~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "AGPL-3.0"
website = "https://readeck.org/"
admindoc = "https://readeck.org/en/docs/"
code = "https://codeberg.org/readeck/readeck"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    i386.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.2/readeck-0.23.2-linux-386"
    i386.sha256 = "4684f9518135c7e731633889bd9e2cc54ef81296f20a2dba77ca9a51498e2265"
    amd64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.2/readeck-0.23.2-linux-amd64"
    amd64.sha256 = "39fc1c52afa5a96ee2cbf44c866fdb97260d8a84fb6abb8030f843830ccd93fd"
    arm64.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.2/readeck-0.23.2-linux-arm64"
    arm64.sha256 = "bdc4323611aefc40d2152c3e4c7f062b44a68b081902ef0059dd7527b52f6fcb"
    armhf.url = "https://codeberg.org/readeck/readeck/releases/download/0.23.2/readeck-0.23.2-linux-arm-5"
    armhf.sha256 = "5ef75d2179412b26fb62e1a66230c260869101b1534dbbf4014bd9c8e6aecb90"
    rename = "readeck"

    autoupdate.strategy = "latest_forgejo_release"
    autoupdate.asset.i386 = "^readeck-.*-linux-386$"
    autoupdate.asset.amd64 = "^readeck-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^readeck-.*-linux-arm64$"
    autoupdate.asset.armhf = "^readeck-.*-linux-arm-5$"
    
    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    api.url = "/api"
    api.allowed = "visitors"
    api.show_tile = false
    api.auth_header = false

    opds.url = "/opds"
    opds.allowed = "visitors"
    opds.show_tile = false
    opds.auth_header = false

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
